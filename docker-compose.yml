# Portfolio José Serrano — VPS vps-prestamos
#
# Se integra con el Traefik existente en el host (no levanta uno propio).
# Traefik descubre el servicio vía Docker labels y gestiona SSL (myresolver).
#
# Setup inicial:
#   cd /aplic/projects/portafolioJoseSerrano
#   cp .env.example .env   # rellenar valores reales
#   docker compose up -d --build
#
# Deploy automático via GitHub Actions (push a main).

name: portfolio-jose

networks:
  traefik-public:
    external: true

volumes:
  uploads:
    driver: local

services:
  portfolio:
    build: .
    image: portfolio-jose:latest
    container_name: portfolio-jose
    restart: unless-stopped
    networks:
      - traefik-public
    expose:
      - "3000"
    volumes:
      - uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - UPLOAD_SECRET=${UPLOAD_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"

      # ── HTTP → HTTPS redirect ───────────────────────────────────────
      traefik.http.middlewares.portfolio-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.portfolio-https-redirect.redirectscheme.permanent: "true"

      # ── Security headers ────────────────────────────────────────────
      traefik.http.middlewares.portfolio-security-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.portfolio-security-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.portfolio-security-headers.headers.stsPreload: "true"
      traefik.http.middlewares.portfolio-security-headers.headers.forceSTSHeader: "true"
      traefik.http.middlewares.portfolio-security-headers.headers.frameDeny: "true"
      traefik.http.middlewares.portfolio-security-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.portfolio-security-headers.headers.referrerPolicy: "strict-origin-when-cross-origin"

      # ── Rate limiting ───────────────────────────────────────────────
      traefik.http.middlewares.portfolio-ratelimit.ratelimit.average: "60"
      traefik.http.middlewares.portfolio-ratelimit.ratelimit.burst: "120"
      traefik.http.middlewares.portfolio-ratelimit.ratelimit.period: "1s"

      # ── HTTP router ─────────────────────────────────────────────────
      traefik.http.routers.portfolio-http.rule: "Host(`jserrano.diasofonline.com`)"
      traefik.http.routers.portfolio-http.entrypoints: "web"
      traefik.http.routers.portfolio-http.middlewares: "portfolio-https-redirect"

      # ── HTTPS router ────────────────────────────────────────────────
      traefik.http.routers.portfolio.rule: "Host(`jserrano.diasofonline.com`)"
      traefik.http.routers.portfolio.entrypoints: "websecure"
      traefik.http.routers.portfolio.tls: "true"
      traefik.http.routers.portfolio.tls.certresolver: "myresolver"
      traefik.http.routers.portfolio.middlewares: "portfolio-security-headers,portfolio-ratelimit"

      # ── Service ─────────────────────────────────────────────────────
      traefik.http.services.portfolio.loadbalancer.server.port: "3000"
