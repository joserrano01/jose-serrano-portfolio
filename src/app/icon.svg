<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#050d1a"/>

  <!-- Ambient glow -->
  <circle cx="16" cy="16" r="13" fill="url(#glow)"/>

  <!-- Soft glow behind center node -->
  <circle cx="16" cy="16" r="6" fill="#2563eb" opacity="0.2" filter="url(#f)"/>

  <!-- Connection lines (drawn before nodes so nodes sit on top) -->
  <line x1="16" y1="16" x2="16" y2="5"  stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="27" stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6"  y2="10" stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26" y2="10" stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6"  y2="22" stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26" y2="22" stroke="#3b82f6" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>

  <!-- Outer nodes -->
  <circle cx="16" cy="5"  r="2.2" fill="url(#g)" opacity="0.9"/>
  <circle cx="16" cy="27" r="2.2" fill="url(#g)" opacity="0.9"/>
  <circle cx="6"  cy="10" r="2.0" fill="url(#g)" opacity="0.8"/>
  <circle cx="26" cy="10" r="2.0" fill="url(#g)" opacity="0.8"/>
  <circle cx="6"  cy="22" r="2.0" fill="url(#g)" opacity="0.8"/>
  <circle cx="26" cy="22" r="2.0" fill="url(#g)" opacity="0.8"/>

  <!-- Center node — outer ring -->
  <circle cx="16" cy="16" r="4.5" fill="#1e3a8a" opacity="0.95"/>
  <!-- Center node — gradient fill -->
  <circle cx="16" cy="16" r="3.2" fill="url(#g)"/>
  <!-- Center node — bright core -->
  <circle cx="16" cy="16" r="1.4" fill="white" opacity="0.95"/>
</svg>
